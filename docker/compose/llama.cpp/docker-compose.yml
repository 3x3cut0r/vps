services:
  # Github: https://github.com/ggml-org/llama.cpp
  # Docker Hub: https://hub.docker.com/r/...
  # Docker Documentation: https://github.com/ggml-org/llama.cpp/blob/master/docs/docker.md
  llama-cpp:
    container_name: llama-cpp
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command: [
      "-m",
      "/models/Qwen3.5-4B-UD-Q5_K_XL.gguf",
      "--alias",
      "qwen3.5-4b",
      "--port",
      "8080",
      "--host",
      "0.0.0.0",
      "--load-mode",
      "mmap",
      "--reasoning",
      "off",
      "-t",
      "8",
      "-c",
      "16384",
      "-n",
      "512"
    ]
    ports:
      - "2145:8080"
    networks:
      llama-cpp:
        ipv4_address: "10.24.45.2"
    dns: ["192.168.40.253"]
    environment:
      TZ: "Europe/Berlin"
      UID: "1000"
      GID: "1000"
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"
      - "wud.display.name=llama.cpp:server"
      - "wud.trigger.include=docker.autoupdate"
      - "wud.link.template=https://github.com/ggml-org/llama.cpp/releases"
    volumes:
      - /opt/docker/config-files/llama-cpp/models:/models

  llama-cpp-warmup:
    container_name: llama-cpp-warmup
    image: curlimages/curl:8.16.0
    restart: "no"
    depends_on:
      - llama-cpp
    networks:
      - llama-cpp
    dns: ["192.168.40.253"]
    command:
      - sh
      - -ec
      - |
        until curl -fsS http://llama-cpp:8080/health >/dev/null; do
          sleep 2
        done

        curl -fsS http://llama-cpp:8080/v1/chat/completions \
          -H 'Content-Type: application/json' \
          -d '{"model":"qwen3.5-4b","messages":[{"role":"user","content":"hello"}]}' \
          >/dev/null

networks:
  llama-cpp:
    name: llama-cpp
    ipam:
      driver: default
      config:
        - subnet: "10.24.45.0/24"
          gateway: "10.24.45.1"
